name: Newsletter Digest Agent

on:
  schedule:
    # 12:00 UTC = 8:00am en Boston durante horario de verano (EDT, UTC-4).
    # En horario de invierno (EST, UTC-5) séria 13:00 UTC. Ajusta si hace falta.
    - cron: '0 12 * * *'
  workflow_dispatch: {}  # permite correrlo a mano desde la pestaña Actions, para probar

permissions:
  contents: write

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests

      - name: Correr agente
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python newsletter_agent.py

      - name: Guardar estado actualizado
        run: |
          git config user.name "newsletter-agent-bot"
          git config user.email "actions@github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "Actualiza estado de newsletters procesados"
          git push
